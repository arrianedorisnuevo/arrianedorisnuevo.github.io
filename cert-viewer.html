<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Certificate — Arriane Doris Nuevo</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@300;400;600;700;800&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
  :root {
    --bg:      #080C10;
    --bg2:     #0D1117;
    --surface: #141C26;
    --border:  rgba(0,220,180,0.12);
    --border2: rgba(255,255,255,0.06);
    --cyan:    #00DCB4;
    --cyan-dim: rgba(0,220,180,0.12);
    --cyan-glow: rgba(0,220,180,0.35);
    --text:    #E2EAF4;
    --text-mid:#8899AA;
    --text-dim:#445566;
    --mono:   'JetBrains Mono', monospace;
    --display:'Syne', sans-serif;
  }

  * { margin:0; padding:0; box-sizing:border-box; }
  html { scroll-behavior:smooth; }

  body {
    font-family: var(--display);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
  }

  /* grid bg */
  body::before {
    content:''; position:fixed; inset:0;
    background-image:
      linear-gradient(rgba(0,220,180,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,220,180,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events:none; z-index:0;
  }

  /* NAV */
  nav {
    position:fixed; top:0; left:0; right:0; z-index:100;
    display:flex; justify-content:space-between; align-items:center;
    padding:0.9rem 3rem;
    background:rgba(8,12,16,0.9);
    backdrop-filter:blur(20px);
    border-bottom:1px solid var(--border);
  }
  .nav-logo { display:flex; align-items:center; gap:0.75rem; text-decoration:none; }
  .nav-logo-mark {
    width:38px; height:28px; border:1.5px solid var(--cyan);
    display:flex; align-items:center; justify-content:center;
    font-family:var(--mono); font-size:0.52rem; color:var(--cyan);
    position:relative; letter-spacing:0.04em;
  }
  .nav-logo-mark::before { content:''; position:absolute; inset:2px; background:var(--cyan-dim); }
  .nav-logo-text { font-family:var(--mono); font-size:0.72rem; letter-spacing:0.1em; color:var(--text-mid); }
  .nav-logo-text span { color:var(--cyan); }

  .nav-right { display:flex; align-items:center; gap:0.6rem; }

  .nav-back, .nav-toggle-list {
    display:flex; align-items:center; gap:0.5rem;
    font-family:var(--mono); font-size:0.62rem; letter-spacing:0.14em; text-transform:uppercase;
    color:var(--text-dim); text-decoration:none;
    border:1px solid var(--border2); padding:0.35rem 0.8rem; border-radius:2px;
    transition:color 0.25s, border-color 0.25s, background 0.25s;
    background:transparent; cursor:pointer;
  }
  .nav-back:hover, .nav-toggle-list:hover { color:var(--cyan); border-color:var(--cyan); background:var(--cyan-dim); }
  .nav-back::before { content:'←'; font-size:0.8rem; }
  .nav-toggle-list.is-hidden { color:var(--cyan); border-color:var(--cyan); background:var(--cyan-dim); }

  /* MAIN */
  main {
    position:relative; z-index:1;
    flex:1; display:flex; flex-direction:column;
    padding-top:72px;
  }

  /* NOT FOUND STATE */
  .not-found {
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:1rem; padding:4rem 2rem; text-align:center;
  }
  .not-found-code { font-family:var(--mono); font-size:4rem; font-weight:700; color:rgba(0,220,180,0.1); }
  .not-found-msg  { font-family:var(--mono); font-size:0.75rem; letter-spacing:0.15em; text-transform:uppercase; color:var(--text-dim); }

  /* CERT VIEWER — two-column layout */
  .cert-viewer {
    flex:1; display:grid;
    grid-template-columns: 280px 1fr;
    grid-template-rows: auto;
    gap:0;
    max-width:1300px; width:100%; margin:0 auto;
    padding:3rem 3rem 4rem;
    transition: grid-template-columns 0.3s ease;
  }
  .cert-viewer.sidebar-hidden { grid-template-columns: 0 1fr; }

  /* LEFT: cert list panel */
  .cert-list-panel {
    padding-right:2rem;
    border-right:1px solid var(--border2);
    display:flex; flex-direction:column; gap:0;
    overflow:hidden;
    transition: opacity 0.25s ease, padding 0.3s ease, border-color 0.3s ease;
  }
  .cert-viewer.sidebar-hidden .cert-list-panel {
    opacity:0; padding:0; border-color:transparent; pointer-events:none;
  }
  .clp-header {
    font-family:var(--mono); font-size:0.58rem; letter-spacing:0.2em;
    text-transform:uppercase; color:var(--cyan);
    display:flex; align-items:center; gap:0.6rem;
    padding-bottom:1rem; margin-bottom:0.5rem;
    border-bottom:1px solid var(--border2);
    white-space:nowrap;
  }
  .clp-header::before { content:'//'; opacity:0.5; }
  .clp-group { margin-bottom:1.4rem; }
  .clp-group-label {
    font-family:var(--mono); font-size:0.5rem; letter-spacing:0.18em;
    text-transform:uppercase; color:var(--text-dim);
    padding:0.5rem 0 0.4rem; margin-bottom:0.2rem;
    border-bottom:1px solid rgba(255,255,255,0.04);
    white-space:nowrap;
  }
  .clp-item {
    display:flex; flex-direction:column; gap:0.15rem;
    padding:0.55rem 0.6rem;
    text-decoration:none;
    border-left:2px solid transparent;
    transition:border-color 0.2s, background 0.2s;
    border-radius:0 2px 2px 0;
    cursor:pointer;
    white-space:nowrap;
  }
  .clp-item:hover { border-left-color:rgba(0,220,180,0.4); background:rgba(0,220,180,0.04); }
  .clp-item.active { border-left-color:var(--cyan); background:rgba(0,220,180,0.07); }
  .clp-item-name {
    font-family:var(--display); font-size:0.78rem; font-weight:600;
    color:var(--text-mid); line-height:1.3;
    transition:color 0.2s;
    white-space:normal;
  }
  .clp-item:hover .clp-item-name,
  .clp-item.active .clp-item-name { color:var(--text); }
  .clp-item.active .clp-item-name { color:var(--cyan); }
  .clp-item-date {
    font-family:var(--mono); font-size:0.52rem; letter-spacing:0.08em;
    color:var(--text-dim);
  }
  .clp-item-ext {
    font-family:var(--mono); font-size:0.5rem; letter-spacing:0.08em;
    color:rgba(0,220,180,0.5); margin-top:0.1rem;
  }

  /* RIGHT: cert detail */
  .cert-detail {
    padding-left:2.5rem;
    display:flex; flex-direction:column;
    grid-column:2;
    min-width:0;
    transition: padding-left 0.3s ease;
  }
  .cert-viewer.sidebar-hidden .cert-detail { padding-left:0.5rem; }

  /* Breadcrumb */
  .breadcrumb {
    font-family:var(--mono); font-size:0.58rem; letter-spacing:0.15em; text-transform:uppercase;
    color:var(--text-dim); margin-bottom:1.5rem; display:flex; align-items:center; gap:0.5rem;
    flex-wrap:wrap;
  }
  .breadcrumb a { color:var(--text-dim); text-decoration:none; transition:color 0.2s; }
  .breadcrumb a:hover { color:var(--cyan); }
  .breadcrumb span { color:var(--cyan); }

  /* Header */
  .cert-header { margin-bottom:1.8rem; display:flex; align-items:flex-start; justify-content:space-between; gap:1rem; flex-wrap:wrap; }
  .cert-org-label {
    font-family:var(--mono); font-size:0.62rem; letter-spacing:0.2em; text-transform:uppercase;
    color:var(--cyan); display:flex; align-items:center; gap:0.8rem; margin-bottom:0.5rem;
  }
  .cert-org-label::after { content:''; width:40px; height:1px; background:var(--cyan); opacity:0.4; }
  .cert-title {
    font-family:var(--display); font-size:clamp(1.3rem,2.5vw,2rem);
    font-weight:700; color:#fff; letter-spacing:-0.02em; margin-bottom:0.5rem; line-height:1.2;
  }
  .cert-meta {
    display:flex; align-items:center; gap:1.2rem; flex-wrap:wrap;
    font-family:var(--mono); font-size:0.6rem; letter-spacing:0.1em;
    text-transform:uppercase; color:var(--text-dim);
  }
  .cert-meta-item { display:flex; align-items:center; gap:0.4rem; }
  .cert-meta-dot { width:4px; height:4px; background:var(--cyan); border-radius:50%; flex-shrink:0; }

  /* Prev/Next pager */
  .cert-pager { display:flex; align-items:center; gap:0.5rem; flex-shrink:0; }
  .pager-btn {
    display:flex; align-items:center; gap:0.4rem;
    font-family:var(--mono); font-size:0.58rem; letter-spacing:0.1em; text-transform:uppercase;
    color:var(--text-dim); border:1px solid var(--border2); padding:0.4rem 0.7rem; border-radius:2px;
    text-decoration:none; transition:all 0.2s;
  }
  .pager-btn:hover { color:var(--cyan); border-color:var(--cyan); background:var(--cyan-dim); }
  .pager-btn.disabled { opacity:0.25; pointer-events:none; }

  /* PDF canvas area */
  .cert-embed-wrap {
    background:var(--surface);
    border:1px solid var(--border); position:relative;
    overflow:hidden; min-height:420px;
    display:flex; align-items:center; justify-content:center;
  }
  .cert-embed-wrap::before {
    content:''; position:absolute; top:0; left:0; right:0;
    height:2px; background:linear-gradient(90deg,transparent,var(--cyan),transparent);
    opacity:0.6; z-index:2; pointer-events:none;
  }
  .cert-embed-wrap::after {
    content:''; position:absolute; bottom:0; right:0;
    width:20px; height:20px;
    border-right:1px solid var(--cyan); border-bottom:1px solid var(--cyan);
    opacity:0.4; z-index:2; pointer-events:none;
  }
  .corner-tl {
    position:absolute; top:0; left:0; width:20px; height:20px;
    border-left:1px solid var(--cyan); border-top:1px solid var(--cyan);
    opacity:0.4; z-index:2; pointer-events:none;
  }
  #cert-canvas {
    display:block; max-width:100%; max-height:72vh;
    box-shadow:0 4px 40px rgba(0,0,0,0.5);
    cursor: zoom-in;
    transition: filter 0.2s;
  }
  #cert-canvas:hover { filter:brightness(1.04); }
  .cv-loading {
    display:flex; flex-direction:column; align-items:center; gap:1rem;
    font-family:'JetBrains Mono',monospace; font-size:0.62rem;
    letter-spacing:0.15em; text-transform:uppercase; color:rgba(0,220,180,0.6);
    min-height:200px; justify-content:center;
  }
  .cv-spinner {
    width:36px; height:36px; border:2px solid rgba(0,220,180,0.12);
    border-top-color:#00DCB4; border-radius:50%;
    animation:spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform:rotate(360deg); } }

  .cert-expand-hint {
    position:absolute; top:12px; right:12px; z-index:3;
    font-family:var(--mono); font-size:0.55rem; letter-spacing:0.1em; text-transform:uppercase;
    color:var(--text-mid); background:rgba(8,12,16,0.75); border:1px solid var(--border2);
    padding:0.4rem 0.7rem; border-radius:2px; cursor:pointer;
    transition:color 0.2s, border-color 0.2s; backdrop-filter:blur(4px);
    display:flex; align-items:center; gap:0.4rem;
  }
  .cert-expand-hint:hover { color:var(--cyan); border-color:var(--cyan); }

  /* Action bar */
  .cert-actions {
    display:flex; align-items:center; gap:0.75rem; margin-top:1.2rem; flex-wrap:wrap;
  }
  .cert-action-btn {
    display:inline-flex; align-items:center; gap:0.5rem;
    font-family:var(--mono); font-size:0.62rem; letter-spacing:0.12em; text-transform:uppercase;
    padding:0.55rem 1.1rem; border-radius:2px; text-decoration:none; cursor:pointer;
    transition:all 0.25s; border:1px solid; background:transparent;
  }
  .cert-action-secondary { color:var(--cyan); border-color:var(--cyan); }
  .cert-action-secondary:hover { background:var(--cyan-dim); }
  .cert-action-ghost { color:var(--text-dim); border-color:var(--border2); }
  .cert-action-ghost:hover { color:var(--cyan); border-color:var(--cyan); }

  /* NOT FOUND */
  .not-found {
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:1rem; padding:4rem 2rem; text-align:center;
  }
  .not-found-code { font-family:var(--mono); font-size:4rem; font-weight:700; color:rgba(0,220,180,0.1); }
  .not-found-msg  { font-family:var(--mono); font-size:0.75rem; letter-spacing:0.15em; text-transform:uppercase; color:var(--text-dim); }

  /* ─── LIGHTBOX ────────────────────────────────────────────────────────── */
  .lightbox {
    position:fixed; inset:0; z-index:1000;
    background:rgba(3,6,9,0.97); backdrop-filter:blur(8px);
    display:none; flex-direction:column;
  }
  .lightbox.open { display:flex; }
  .lightbox-toolbar {
    display:flex; align-items:center; justify-content:center; gap:0.75rem;
    padding:1rem 1.2rem; border-bottom:1px solid var(--border);
    flex-wrap:wrap; flex-shrink:0;
  }
  .lb-btn {
    display:inline-flex; align-items:center; gap:0.4rem;
    font-family:var(--mono); font-size:0.6rem; letter-spacing:0.1em; text-transform:uppercase;
    color:var(--text-mid); border:1px solid var(--border2); background:transparent;
    padding:0.5rem 0.85rem; border-radius:2px; cursor:pointer; text-decoration:none;
    transition:all 0.2s;
  }
  .lb-btn:hover { color:var(--cyan); border-color:var(--cyan); background:var(--cyan-dim); }
  .lb-zoom-label {
    font-family:var(--mono); font-size:0.6rem; letter-spacing:0.1em; color:var(--cyan);
    min-width:3.2em; text-align:center;
  }
  .lb-spacer { width:1px; height:20px; background:var(--border2); margin:0 0.4rem; }
  .lb-close { color:var(--text-dim); border-color:var(--border2); margin-left:auto; }
  .lightbox-stage {
    flex:1; overflow:auto; display:flex; align-items:flex-start; justify-content:center;
    padding:2.5rem;
  }
  #lightbox-canvas {
    box-shadow:0 4px 60px rgba(0,0,0,0.6);
    transform-origin: top center;
    transition: transform 0.15s ease;
    flex-shrink:0;
  }
  .lb-loading {
    margin:auto; display:flex; flex-direction:column; align-items:center; gap:1rem;
    font-family:var(--mono); font-size:0.62rem; letter-spacing:0.15em; text-transform:uppercase;
    color:rgba(0,220,180,0.6);
  }

  /* Footer */
  footer {
    position:relative; z-index:1;
    border-top:1px solid var(--border); padding:1.5rem 3rem;
    display:flex; justify-content:space-between; align-items:center;
    background:var(--bg);
  }
  .footer-brand { font-family:var(--mono); font-size:0.6rem; letter-spacing:0.12em; color:var(--text-dim); }
  .footer-brand span { color:var(--cyan); }
  .footer-copy { font-family:var(--mono); font-size:0.58rem; color:var(--text-dim); }

  /* MOBILE: stack layout */
  @media (max-width:900px) {
    nav { padding:0.9rem 1.2rem; }
    .cert-viewer { grid-template-columns:1fr; padding:1.5rem 1.2rem 3rem; gap:0; }
    .cert-viewer.sidebar-hidden { grid-template-columns:1fr; }
    .cert-list-panel {
      padding-right:0; border-right:none; border-bottom:1px solid var(--border2);
      padding-bottom:1.5rem; margin-bottom:1.5rem; max-height:280px; overflow-y:auto;
    }
    .cert-viewer.sidebar-hidden .cert-list-panel { max-height:0; margin-bottom:0; padding-bottom:0; border-bottom:none; }
    .cert-detail { padding-left:0; }
    .cert-viewer.sidebar-hidden .cert-detail { padding-left:0; }
    .nav-back span, .nav-toggle-list span.label { display:none; }
    footer { padding:1.5rem 1.2rem; flex-direction:column; gap:0.5rem; }
    .cert-embed-wrap { min-height:280px; }
    .lightbox-toolbar { justify-content:flex-start; }
    .lb-close { margin-left:0; order:99; width:100%; justify-content:center; }
  }
</style>
</head>
<body>

<!-- NAV -->
<nav>
  <a class="nav-logo" href="index.html">
    <div class="nav-logo-mark">ADLN</div>
    <div class="nav-logo-text"><span>arriane</span>.dev</div>
  </a>
  <div class="nav-right">
    <button class="nav-toggle-list" id="sidebarToggleBtn" title="Show or hide the certificate list">
      <span id="sidebarToggleIcon">☰</span><span class="label" id="sidebarToggleLabel">Hide List</span>
    </button>
    <a class="nav-back" href="index.html"><span>Back to Portfolio</span></a>
  </div>
</nav>

<main id="main">
  <!-- Content injected by JS -->
</main>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox">
  <div class="lightbox-toolbar">
    <button class="lb-btn" data-action="zoom-out" title="Zoom out">−</button>
    <span class="lb-zoom-label" id="lbZoomLabel">100%</span>
    <button class="lb-btn" data-action="zoom-in" title="Zoom in">+</button>
    <button class="lb-btn" data-action="reset" title="Reset zoom">Reset</button>
    <div class="lb-spacer"></div>
    <a class="lb-btn" id="lbDownload" download title="Download PDF">⭳ Download</a>
    <button class="lb-btn" data-action="print" title="Open for printing">🖶 Print</button>
    <button class="lb-btn lb-close" data-action="close" title="Close (Esc)">✕ Close</button>
  </div>
  <div class="lightbox-stage" id="lightboxStage">
    <div class="lb-loading" id="lbLoading">
      <div class="cv-spinner"></div>
      <span>Rendering certificate...</span>
    </div>
    <canvas id="lightbox-canvas" style="display:none;"></canvas>
  </div>
</div>

<footer>
  <div class="footer-brand"><span>arriane</span>.dev // ADLN</div>
  <div class="footer-copy">&copy; 2026 Arriane Doris Nuevo</div>
</footer>

<script>
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  // ─── Certificate Registry (grouped for sidebar) ───────────────────────────
  const CERT_GROUPS = [
    {
      org: 'Canva Design School',
      certs: [
        { id:'canva-graphic-design-essentials', title:'Graphic Design Essentials', date:'Mar 9, 2025', extUrl:'https://www.canva.com/en/design-school/certification-award/783198ed-efac-4deb-9458-8443343165fe' },
      ]
    },
    {
      org: 'freeCodeCamp.org',
      certs: [
        { id:'fcc-responsive-web-design', title:'Responsive Web Design', date:'Jun 4, 2025', extUrl:'https://www.freecodecamp.org/certification/arrianedoris/responsive-web-design' },
      ]
    },
    {
      org: 'Google Applied Digital Skills',
      certs: [
        { id:'google-ads-program-progress-bar',   title:'Program a Progress Bar',                      date:'Mar 8, 2025'  },
        { id:'google-ads-research-develop-topic', title:'Research and Develop a Topic',                date:'Mar 2, 2025'  },
        { id:'google-ads-prepare-business-plan',  title:'Prepare Your Business Plan',                  date:'Mar 2, 2025'  },
        { id:'google-ads-estimate-financing',     title:'Estimate Financing for Your Business Plan',   date:'Feb 28, 2025' },
        { id:'google-ads-build-online-business',  title:'Build Your Online Business',                  date:'Feb 28, 2025' },
        { id:'google-ads-discover-ai-daily-life', title:'Discover AI in Daily Life',                   date:'Feb 27, 2025' },
      ]
    },
    {
      org: 'DICT RO IX',
      certs: [
        { id:'dict-image-editing-open-source', title:'Image Editing Using Open-Source Software', date:'May 7–9, 2019' },
      ]
    },
    {
      org: 'TESDA',
      certs: [
        { id:'tesda-english-proficiency', title:'English Proficiency', date:'Dec 8–22, 2014' },
      ]
    },
  ];

  // Flatten for quick lookup + prev/next navigation
  const CERTS_BY_ID = {};
  const FLAT_CERTS = [];
  CERT_GROUPS.forEach(g => g.certs.forEach(c => {
    const full = { ...c, org: g.org, pdf: c.id + '.pdf' };
    CERTS_BY_ID[c.id] = full;
    FLAT_CERTS.push(full);
  }));

  function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ─── Sidebar collapse (persisted) ──────────────────────────────────────────
  const SIDEBAR_KEY = 'certViewerSidebarHidden';
  function isSidebarHidden() { return localStorage.getItem(SIDEBAR_KEY) === '1'; }
  function setSidebarHidden(hidden) {
    localStorage.setItem(SIDEBAR_KEY, hidden ? '1' : '0');
    const viewer = document.querySelector('.cert-viewer');
    if (viewer) viewer.classList.toggle('sidebar-hidden', hidden);
    const icon  = document.getElementById('sidebarToggleIcon');
    const label = document.getElementById('sidebarToggleLabel');
    const btn   = document.getElementById('sidebarToggleBtn');
    if (icon)  icon.textContent  = hidden ? '☰' : '✕';
    if (label) label.textContent = hidden ? 'Show List' : 'Hide List';
    if (btn)   btn.classList.toggle('is-hidden', hidden);
  }
  document.getElementById('sidebarToggleBtn').addEventListener('click', () => {
    setSidebarHidden(!isSidebarHidden());
  });

  // ─── Build sidebar HTML ───────────────────────────────────────────────────
  function buildSidebar(activeId) {
    let html = `<div class="cert-list-panel">
      <div class="clp-header">All Certifications</div>`;
    CERT_GROUPS.forEach(g => {
      html += `<div class="clp-group">
        <div class="clp-group-label">${escHtml(g.org)}</div>`;
      g.certs.forEach(c => {
        const isActive = c.id === activeId;
        html += `<a class="clp-item${isActive ? ' active' : ''}" href="cert-viewer.html?id=${c.id}">
          <span class="clp-item-name">${escHtml(c.title)}</span>
          <span class="clp-item-date">${escHtml(c.date)}</span>
          ${c.extUrl ? '<span class="clp-item-ext">&#x2197; has external link</span>' : ''}
        </a>`;
      });
      html += `</div>`;
    });
    html += `</div>`;
    return html;
  }

  // ─── Render PDF to main canvas ──────────────────────────────────────────────
  async function renderCert(pdfUrl) {
    const canvas  = document.getElementById('cert-canvas');
    const loading = document.getElementById('cvLoading');
    try {
      const pdf      = await pdfjsLib.getDocument(pdfUrl).promise;
      const page     = await pdf.getPage(1);
      const vp0      = page.getViewport({ scale: 1 });
      const dpr      = Math.min(window.devicePixelRatio || 1, 2);
      const maxW     = (window.innerWidth  * 0.6) * dpr;
      const maxH     = (window.innerHeight * 0.72) * dpr;
      const scale    = Math.min(maxW / vp0.width, maxH / vp0.height);
      const viewport = page.getViewport({ scale });
      canvas.width   = viewport.width;
      canvas.height  = viewport.height;
      const dispW    = viewport.width / dpr;
      canvas.style.width  = Math.min(dispW, window.innerWidth * 0.6) + 'px';
      canvas.style.height = 'auto';
      await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
      loading.style.display = 'none';
      canvas.style.display  = 'block';
    } catch(e) {
      loading.innerHTML = `<span style="color:rgba(0,220,180,0.5);font-family:var(--mono);font-size:0.6rem;letter-spacing:0.1em;text-align:center;">Could not render PDF.<br>Try opening directly.</span>`;
    }
  }

  // ─── Lightbox: high-res render + zoom/pan/download/print ──────────────────
  let lbZoom = 1;
  let lbRenderedFor = null;

  function applyLbZoom() {
    const canvas = document.getElementById('lightbox-canvas');
    canvas.style.transform = `scale(${lbZoom})`;
    document.getElementById('lbZoomLabel').textContent = Math.round(lbZoom * 100) + '%';
  }

  async function renderLightbox(cert) {
    const canvas  = document.getElementById('lightbox-canvas');
    const loading = document.getElementById('lbLoading');
    if (lbRenderedFor === cert.id) { return; } // already rendered for this cert
    loading.style.display = 'flex';
    canvas.style.display  = 'none';
    try {
      const pdf      = await pdfjsLib.getDocument(cert.pdf).promise;
      const page     = await pdf.getPage(1);
      const vp0      = page.getViewport({ scale: 1 });
      const dpr      = Math.min(window.devicePixelRatio || 1, 2);
      const targetW  = Math.min(1600, window.innerWidth * 0.9) * dpr;
      const scale    = targetW / vp0.width;
      const viewport = page.getViewport({ scale });
      canvas.width   = viewport.width;
      canvas.height  = viewport.height;
      canvas.style.width  = (viewport.width / dpr) + 'px';
      canvas.style.height = 'auto';
      await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
      lbRenderedFor = cert.id;
      loading.style.display = 'none';
      canvas.style.display  = 'block';
    } catch (e) {
      loading.innerHTML = `<span style="color:rgba(0,220,180,0.5);font-family:var(--mono);font-size:0.6rem;letter-spacing:0.1em;text-align:center;">Could not render PDF.<br>Try downloading instead.</span>`;
    }
  }

  function openLightbox(cert) {
    lbZoom = 1;
    applyLbZoom();
    document.getElementById('lightbox').classList.add('open');
    document.body.style.overflow = 'hidden';
    document.getElementById('lbDownload').href = cert.pdf;
    document.getElementById('lbDownload').setAttribute('download', cert.title + '.pdf');
    document.getElementById('lightbox').dataset.currentPdf = cert.pdf;
    renderLightbox(cert);
  }
  function closeLightbox() {
    document.getElementById('lightbox').classList.remove('open');
    document.body.style.overflow = '';
  }

  document.getElementById('lightbox').addEventListener('click', (e) => {
    const action = e.target.closest('[data-action]')?.dataset.action;
    if (!action) return;
    if (action === 'close')    closeLightbox();
    if (action === 'zoom-in')  { lbZoom = Math.min(3, +(lbZoom + 0.25).toFixed(2)); applyLbZoom(); }
    if (action === 'zoom-out') { lbZoom = Math.max(0.5, +(lbZoom - 0.25).toFixed(2)); applyLbZoom(); }
    if (action === 'reset')    { lbZoom = 1; applyLbZoom(); }
    if (action === 'print') {
      const pdfUrl = document.getElementById('lightbox').dataset.currentPdf;
      if (pdfUrl) window.open(pdfUrl, '_blank');
    }
  });

  // ─── Copy link ────────────────────────────────────────────────────────────
  function copyLink() {
    navigator.clipboard.writeText(window.location.href).then(() => {
      const btn = document.querySelector('[onclick="copyLink()"]');
      const orig = btn.innerHTML;
      btn.innerHTML = '✓ Copied!';
      btn.style.color = 'var(--cyan)'; btn.style.borderColor = 'var(--cyan)';
      setTimeout(() => { btn.innerHTML = orig; btn.style.color=''; btn.style.borderColor=''; }, 2000);
    });
  }

  function navigateTo(id) {
    if (!id) return;
    window.location.href = 'cert-viewer.html?id=' + id;
  }

  // ─── Main render ─────────────────────────────────────────────────────────
  (async function() {
    const params = new URLSearchParams(window.location.search);
    const id     = params.get('id');
    const main   = document.getElementById('main');
    const cert   = id ? CERTS_BY_ID[id] : null;

    if (cert) document.title = cert.title + ' — Arriane Doris Nuevo';

    if (!cert) {
      main.innerHTML = `
        <div style="flex:1;display:flex;flex-direction:column;">
          <div class="cert-viewer" style="max-width:1300px;width:100%;margin:0 auto;padding:3rem;">
            ${buildSidebar(null)}
            <div class="cert-detail" style="display:flex;align-items:center;justify-content:center;">
              <div class="not-found">
                <div class="not-found-code">—</div>
                <div class="not-found-msg" style="margin-bottom:0.5rem;">Select a certificate from the list</div>
              </div>
            </div>
          </div>
        </div>`;
      setSidebarHidden(isSidebarHidden());
      return;
    }

    const extUrl = cert.extUrl || null;
    const flatIdx = FLAT_CERTS.findIndex(c => c.id === id);
    const prevCert = flatIdx > 0 ? FLAT_CERTS[flatIdx - 1] : null;
    const nextCert = flatIdx >= 0 && flatIdx < FLAT_CERTS.length - 1 ? FLAT_CERTS[flatIdx + 1] : null;

    main.innerHTML = `
      <div class="cert-viewer">
        ${buildSidebar(id)}
        <div class="cert-detail">
          <div class="breadcrumb">
            <a href="index.html">Portfolio</a>
            <span>//</span>
            <a href="index.html#certifications">Certifications</a>
            <span>//</span>
            <span style="color:var(--text-mid)">${escHtml(cert.title)}</span>
          </div>
          <div class="cert-header">
            <div>
              <div class="cert-org-label">${escHtml(cert.org)}</div>
              <div class="cert-title">${escHtml(cert.title)}</div>
              <div class="cert-meta">
                <div class="cert-meta-item"><div class="cert-meta-dot"></div><span>${escHtml(cert.date)}</span></div>
                <div class="cert-meta-item"><div class="cert-meta-dot"></div><span>ID // ${escHtml(id)}</span></div>
                <div class="cert-meta-item"><span>${flatIdx + 1} of ${FLAT_CERTS.length}</span></div>
              </div>
            </div>
            <div class="cert-pager">
              <button class="pager-btn${prevCert ? '' : ' disabled'}" id="prevCertBtn" title="${prevCert ? escHtml(prevCert.title) : ''}">‹ Prev</button>
              <button class="pager-btn${nextCert ? '' : ' disabled'}" id="nextCertBtn" title="${nextCert ? escHtml(nextCert.title) : ''}">Next ›</button>
            </div>
          </div>
          <div class="cert-embed-wrap" id="embedWrap">
            <div class="corner-tl"></div>
            <div class="cert-expand-hint" id="expandHintBtn">⤢ Expand &amp; Zoom</div>
            <div class="cv-loading" id="cvLoading">
              <div class="cv-spinner"></div>
              <span>Rendering certificate...</span>
            </div>
            <canvas id="cert-canvas" style="display:none;"></canvas>
          </div>
          <div class="cert-actions">
            ${extUrl
              ? `<a class="cert-action-btn cert-action-secondary" href="${extUrl}" target="_blank" rel="noopener">&#x2197; View on ${escHtml(cert.org.split(' ')[0])}</a>`
              : `<a class="cert-action-btn cert-action-secondary" href="${cert.pdf}" target="_blank" rel="noopener">&#x2197; Open PDF</a>`
            }
            <button class="cert-action-btn cert-action-ghost" id="expandActionBtn">⤢ Expand &amp; Zoom</button>
            <button class="cert-action-btn cert-action-ghost" onclick="copyLink()">&#x29C9; Copy Link</button>
            <a class="cert-action-btn cert-action-ghost" href="index.html#certifications">← Portfolio</a>
          </div>
        </div>
      </div>`;

    // Wire up sidebar collapse state on the freshly-injected .cert-viewer
    setSidebarHidden(isSidebarHidden());

    // Pager buttons
    if (prevCert) document.getElementById('prevCertBtn').addEventListener('click', () => navigateTo(prevCert.id));
    if (nextCert) document.getElementById('nextCertBtn').addEventListener('click', () => navigateTo(nextCert.id));

    // Expand / lightbox triggers
    document.getElementById('expandHintBtn').addEventListener('click', () => openLightbox(cert));
    document.getElementById('expandActionBtn').addEventListener('click', () => openLightbox(cert));
    document.getElementById('cert-canvas').addEventListener('click', () => openLightbox(cert));

    // Keyboard shortcuts: Esc closes lightbox, ←/→ navigate between certs
    document.addEventListener('keydown', (e) => {
      const lb = document.getElementById('lightbox');
      if (e.key === 'Escape' && lb.classList.contains('open')) { closeLightbox(); return; }
      if (lb.classList.contains('open')) return; // don't navigate certs while lightbox is open
      if (e.key === 'ArrowLeft'  && prevCert) navigateTo(prevCert.id);
      if (e.key === 'ArrowRight' && nextCert) navigateTo(nextCert.id);
    });

    await renderCert(cert.pdf);
  })();
</script>

</body>
